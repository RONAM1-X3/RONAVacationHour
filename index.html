<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee Vacation Hours Forecaster</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 450px; margin: 40px auto; padding: 20px; background: #f9fafb; }
    .card { background: white; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    label { display: block; margin-top: 14px; font-weight: 600; font-size: 14px; }
    input { width: 100%; padding: 10px; margin-top: 6px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; margin-top: 20px; background: #2563eb; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .result-box { margin-top: 20px; padding: 15px; background: #eff6ff; border-left: 4px solid #2563eb; border-radius: 4px; }
    .result-box p { margin: 6px 0; }
    .error { color: #dc2626; font-size: 14px; margin-top: 10px; display: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Vacation Hours Forecaster</h2>
    
    <label for="hireDate">Employee Hire Date</label>
    <input type="date" id="hireDate">

    <label for="currentHours">Current Vacation Balance (Hours)</label>
    <input type="number" id="currentHours" value="40" min="0" step="0.5">

    <label for="targetDate">Forecast Target Date</label>
    <input type="date" id="targetDate">

    <label for="plannedUse">Planned Vacation Used Before Target Date (Hours)</label>
    <input type="number" id="plannedUse" value="0" min="0" step="0.5">

    <p class="error" id="errorMsg">Please select a valid Hire Date and a Target Date in the future.</p>

    <button onclick="forecastVacation()">Calculate Forecast</button>

    <div class="result-box" id="output" style="display:none;">
      <p><strong>Current Tenure:</strong> <span id="currentTenureDisplay">0</span> years</p>
      <p><strong>Tenure on Target Date:</strong> <span id="futureTenureDisplay">0</span> years</p>
      <p><strong>Hours Earned in Period:</strong> <span id="earnedDisplay">0</span> hrs</p>
      <p style="font-size: 18px; margin-top: 10px;"><strong>Projected Balance:</strong> <span id="totalDisplay">0</span> hrs</p>
    </div>
  </div>

  <script>
    // Set default dates on page load (Hire date: 2 years ago, Target date: 6 months from today)
    window.onload = function() {
      const today = new Date();
      const twoYearsAgo = new Date(today.getFullYear() - 2, today.getMonth(), today.getDate());
      const sixMonthsAhead = new Date(today.getFullYear(), today.getMonth() + 6, today.getDate());
      
      document.getElementById('hireDate').valueAsDate = twoYearsAgo;
      document.getElementById('targetDate').valueAsDate = sixMonthsAhead;
    };

    // CUSTOMIZE YOUR ANNUAL VACATION HOURS BY TENURE HERE
    function getAnnualHours(tenureInYears) {
      if (tenureInYears < 1) {
        return 80;  // 2 weeks (80 hrs/year) for < 1 year
      } else if (tenureInYears >= 1 && tenureInYears < 5) {
        return 120; // 3 weeks (120 hrs/year) for 1 to 4.99 years
      } else {
        return 160; // 4 weeks (160 hrs/year) for 5+ years
      }
    }

    function forecastVacation() {
      const hireInput = document.getElementById('hireDate').value;
      const targetInput = document.getElementById('targetDate').value;
      const currentHours = parseFloat(document.getElementById('currentHours').value) || 0;
      const plannedUse = parseFloat(document.getElementById('plannedUse').value) || 0;
      const errorMsg = document.getElementById('errorMsg');

      if (!hireInput || !targetInput) {
        errorMsg.style.display = 'block';
        return;
      }

      // Normalize dates to midnight local time to avoid timezone shifts
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const hireDate = new Date(hireInput + 'T00:00:00');
      const targetDate = new Date(targetInput + 'T00:00:00');

      if (targetDate <= today || targetDate <= hireDate) {
        errorMsg.style.display = 'block';
        document.getElementById('output').style.display = 'none';
        return;
      }
      errorMsg.style.display = 'none';

      // Calculate accrual day-by-day so mid-period anniversaries automatically bump up the rate
      let totalEarned = 0;
      const msPerDay = 1000 * 60 * 60 * 24;
      const daysToForecast = Math.round((targetDate - today) / msPerDay);

      for (let i = 1; i <= daysToForecast; i++) {
        const simDate = new Date(today.getTime() + (i * msPerDay));
        const tenureYearsOnDay = (simDate - hireDate) / (msPerDay * 365.25);
        
        if (tenureYearsOnDay >= 0) {
          const annualAllowance = getAnnualHours(tenureYearsOnDay);
          totalEarned += (annualAllowance / 365.25);
        }
      }

      const currentTenure = Math.max(0, (today - hireDate) / (msPerDay * 365.25));
      const futureTenure = (targetDate - hireDate) / (msPerDay * 365.25);
      const projectedTotal = currentHours + totalEarned - plannedUse;

      document.getElementById('currentTenureDisplay').innerText = currentTenure.toFixed(1);
      document.getElementById('futureTenureDisplay').innerText = futureTenure.toFixed(1);
      document.getElementById('earnedDisplay').innerText = totalEarned.toFixed(2);
      document.getElementById('totalDisplay').innerText = projectedTotal.toFixed(2);
      document.getElementById('output').style.display = 'block';
    }
  </script>
</body>
</html>
